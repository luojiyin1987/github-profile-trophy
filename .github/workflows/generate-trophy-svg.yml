name: Generate Trophy SVG

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-trophy-svg
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.0.1"

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deps.ts', 'deno.json', 'api/**/*.ts', 'src/**/*.ts', 'scripts/**/*.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Diagnose GitHub GraphQL
        env:
          PAT: ${{ secrets.PAT_1 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PAT:-}" ]; then
            echo "::error::PAT_1 is empty or unavailable"
            exit 1
          fi

          jq -n \
            --arg login "${{ github.repository_owner }}" \
            '{
              query: "query($login: String!) { viewer { login } user(login: $login) { repositories(first: 10, ownerAffiliations: OWNER, orderBy: { field: STARGAZERS, direction: DESC }) { totalCount nodes { name stargazerCount } } } }",
              variables: {
                login: $login
              }
            }' > /tmp/query.json

          curl -fsS \
            -H "Authorization: bearer ${PAT}" \
            -H "Content-Type: application/json" \
            --data @/tmp/query.json \
            https://api.github.com/graphql \
            > /tmp/result.json

          jq '{
            errors,
            viewer: .data.viewer.login,
            repositoryCount: .data.user.repositories.totalCount,
            repositories: .data.user.repositories.nodes
          }' /tmp/result.json

          if jq -e '.errors != null' /tmp/result.json >/dev/null; then
            echo "::error::GitHub GraphQL returned errors"
            exit 1
          fi

      - name: Generate SVG
        env:
          GITHUB_TOKEN1: ${{ secrets.PAT_1 }}
          GITHUB_TOKEN2: ${{ secrets.PAT_2 }}
        run: >
          deno run -A scripts/generate-trophy-svg.ts
          --username "${{ github.repository_owner }}"
          --output "generated/${{ github.repository_owner }}.svg"

      - name: Commit and force push to trophy-svg branch
        run: |
          OUTPUT_FILE="generated/${{ github.repository_owner }}.svg"
          if [ ! -f "${OUTPUT_FILE}" ]; then
            echo "Missing output file: ${OUTPUT_FILE}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan trophy-svg-tmp
          git add -f "${OUTPUT_FILE}"
          git commit -m "chore: update trophy svg"
          git push --force origin HEAD:trophy-svg
